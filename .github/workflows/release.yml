name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build a universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/presence \
            target/x86_64-apple-darwin/release/presence \
            -output dist/presence

      - name: Package Presence.app
        env:
          # Set the APPLE_CODESIGN_IDENTITY secret to sign the app before it is zipped.
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: ./packaging/package.sh dist/presence dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Presence-macos.zip
